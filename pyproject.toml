[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-qa"
version = "1.0.0"
description = "Production-style local RAG document Q&A API using FastAPI, ChromaDB, Sentence Transformers, and SQLite"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.128,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "chromadb>=1.5.9,<2.0",
  "pydantic-settings>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
# Local embeddings with sentence-transformers. Brings in torch, so images without it stay small.
local = [
  "sentence-transformers>=5.6,<6.0",
]
dev = [
  "pytest>=9.0,<10.0",
  "pytest-cov>=7.0,<8.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# The web UI, served by the app, so a non-editable install (the Docker image) carries it.
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI parameter markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query"]
